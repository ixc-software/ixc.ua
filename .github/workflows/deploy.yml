name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Generate sitemap.xml for SEO
      - name: Generate sitemap
        run: |
          cat > dist/sitemap.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://ixc.ua/</loc><changefreq>weekly</changefreq><priority>1.0</priority></url>
            <url><loc>https://ixc.ua/about-us</loc><changefreq>monthly</changefreq><priority>0.8</priority></url>
            <url><loc>https://ixc.ua/privacy-policy</loc><changefreq>yearly</changefreq><priority>0.5</priority></url>
            <url><loc>https://ixc.ua/products/softswitch</loc><changefreq>monthly</changefreq><priority>0.9</priority></url>
            <url><loc>https://ixc.ua/products/white-black-list</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>
            <url><loc>https://ixc.ua/products/monitoring-tool</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>
            <url><loc>https://ixc.ua/products/ixc-autotester</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>
            <url><loc>https://ixc.ua/products/sms-platform</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>
            <url><loc>https://ixc.ua/products/google-api</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>
          </urlset>
          EOF

      # Generate robots.txt for SEO
      - name: Generate robots.txt
        run: |
          cat > dist/robots.txt << 'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://ixc.ua/sitemap.xml
          EOF

      # Copy index.html to 404.html for SPA client-side routing
      - name: Create 404 fallback
        run: cp dist/index.html dist/404.html

      # Add CNAME for custom domain
      - name: Add CNAME
        run: echo "ixc.ua" > dist/CNAME

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
